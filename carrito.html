<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Carrito | Hankel Instruments</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <style>
        .btn-whatsapp-carrito {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            width: 100%;
            background: #25D366;
            color: #fff;
            padding: 14px 20px;
            border-radius: 40px;
            font-weight: 600;
            font-size: 0.95rem;
            border: none;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 16px;
        }
        .btn-whatsapp-carrito:hover { background: #1ea952; transform: scale(1.02); }
        .btn-whatsapp-carrito svg { width: 20px; height: 20px; flex-shrink: 0; }
    </style>
</head>
<body>

    <header>
        <div class="container">
            <nav>
                <a href="index.html">
                    <img src="logo.jpg" alt="Hankel Instruments Logo" class="logo" id="mainLogo" onerror="handleLogoError()">
                    <span id="logoFallbackText" style="display:none; font-family:'Azonix'; font-size:1.6rem; color:#00bcd4;">HANKEL</span>
                </a>
                <button class="nav-toggle" id="navToggle" type="button" aria-label="Abrir menú" aria-expanded="false" aria-controls="navLinks">
                    <span></span><span></span><span></span>
                </button>
                <ul class="nav-links" id="navLinks">
                    <li><a href="index.html">Inicio</a></li>
                    <li><a href="productos.html">Productos</a></li>
                    <li><a href="academia.html">Hankel Academy</a></li>
                    <li><a href="admin.html" class="admin-link" title="Panel Admin">🔒</a></li>
                    <li><a href="carrito.html" class="cart-icon active">🛒<span class="cart-badge" id="cartBadge">0</span></a></li>
                </ul>
            </nav>
        </div>
    </header>

    <div class="page-hero">
        <div class="container">
            <h1>Tu Carrito</h1>
            <p>Revisa tus productos y cursos, y continúa el pedido por WhatsApp.</p>
        </div>
    </div>

    <section>
        <div class="container carrito-layout">
            <div id="carritoItems"><!-- Se llena con JS --></div>

            <div id="resumenContainer" class="carrito-resumen">
                <h3 style="color:#fff; margin-bottom:20px;">Resumen del pedido</h3>
                <div class="carrito-total-linea">
                    <span>Total</span>
                    <span id="totalCarrito">S/ 0.00</span>
                </div>
                <button id="btnPagar" class="btn-whatsapp-carrito">
                    <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
                        <path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 0 1-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 0 1-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 0 1 2.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0 0 12.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 0 0 5.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 0 0-3.48-8.413z"/>
                    </svg>
                    Continuar por WhatsApp
                </button>

                <p style="font-size:0.75rem; color:#9aa3b5; margin-top:16px; text-align:center;">
                    Te enviamos el detalle del pedido a WhatsApp y coordinamos el pago contigo.
                </p>
            </div>
        </div>
    </section>

    <footer>
        <div class="container">
            <p style="font-size:0.85rem;">&copy; 2026 Hankel Instruments</p>
        </div>
    </footer>

    <script src="js/config.js"></script>
    <script src="js/carrito.js"></script>
    <script src="js/checkout.js"></script>
    <script src="js/main.js"></script>
</body>
</html>
